# Experimento 1 — MLP pequena, igual em espírito ao código da aula (1 camada oculta com 16 neurônios).
# Qualquer chave pode ser sobrescrita na linha de comando com --set, ex.: --set treino.lr=0.001

experimento:
  nome: "exp01_mlp_pequena"          # nome do experimento no MLflow
  pergunta: "Uma MLP pequena (1 camada oculta com 16 neurônios, como no código da aula) já consegue boa F1 para aprovar/rejeitar crédito?"
  run_name: "mlp_16"                 # nome da run dentro do experimento
  tracking_uri: "sqlite:///mlflow.db"

seed: 42                             # semente fixa para reprodutibilidade (numpy, torch, split)

dados:
  caminho_local: "data/crx.data"     # cópia local do dataset (baixado do UCI na 1ª execução)
  uci_id: 27                         # id do Credit Approval no repositório UCI
  frac_val: 0.15                     # 15% para validação
  frac_test: 0.15                    # 15% para teste (o restante, 70%, é treino)

modelo:
  camadas_ocultas: [16]              # lista de neurônios por camada oculta
  dropout: 0.0                       # 0 = sem dropout

treino:
  lr: 0.01                           # taxa de aprendizado do Adam (igual ao código da aula)
  weight_decay: 0.0                  # regularização L2 (0 = desligada)
  batch_size: 32                     # tamanho do mini-batch
  epocas: 200                        # máximo de épocas
  paciencia: 20                      # early stopping: para se a val_loss não melhorar por N épocas
