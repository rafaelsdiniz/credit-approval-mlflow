# Experimento 2 — MLP maior (duas camadas ocultas: 128 e 64 neurônios).
# Pergunta: mais capacidade ajuda ou só aumenta o overfitting num dataset de 690 linhas?

experimento:
  nome: "exp02_mlp_grande"
  pergunta: "Uma MLP maior (128-64) melhora o resultado ou só aumenta o overfitting num dataset pequeno de 690 linhas?"
  run_name: "mlp_128_64"
  tracking_uri: "sqlite:///mlflow.db"

seed: 42

dados:
  caminho_local: "data/crx.data"
  uci_id: 27
  frac_val: 0.15
  frac_test: 0.15

modelo:
  camadas_ocultas: [128, 64]
  dropout: 0.0

treino:
  lr: 0.01
  weight_decay: 0.0
  batch_size: 32
  epocas: 200
  paciencia: 20
