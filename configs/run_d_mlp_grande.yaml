# Rodada D — INVESTIGAÇÃO EXTRA: MLP maior (duas camadas ocultas, 128 e 64).
# Mesmo split, seed, lr e épocas de A; muda só a arquitetura.

experimento:
  nome: "credit_approval_mlp"
  run_name: "D_mlp_grande"
  pergunta: "Uma MLP maior (128-64) melhora o resultado ou só aumenta o overfitting num dataset de 690 linhas?"
  hipotese: "Com ~18x mais parâmetros que A e apenas 483 exemplos de treino, a rede deve decorar o treino: train_loss perto de zero e val_loss subindo cedo. Se isso acontecer, a maior capacidade não se traduz em melhor teste."
  tracking_uri: "sqlite:///mlflow.db"

seed: 42

dados:
  caminho_local: "data/crx.data"
  uci_id: 27
  frac_val: 0.15
  frac_test: 0.15
  estratificado: true

modelo:
  camadas_ocultas: [128, 64]          # (*) duas camadas ocultas
  dropout: 0.0

treino:
  lr: 0.01
  weight_decay: 0.0
  batch_size: 32
  epocas: 200
  paciencia: 20
